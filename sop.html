<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1d2a26;--mut:#5b6b66;--line:#d9dfdb;--brand:#003E2D;--acc:#0C769E;

@media (prefers-color-scheme:dark){:root{--bg:#121917;--card:#1b2420;--ink:#e6eeea;--mut:#9db0a9;--line:#2f3d37;--brand:#7fd1b4;--acc:#6cc3e3;
--ok:#6fd49c;--inf:#e0b25a;--k:#6cc3e3;--t:#b79cf0;--n:#9db0a9;--x:#e6eeea;--box:rgba(108,195,227,.12)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
h1{margin:0;font-size:1.15rem;color:var(--brand)}
.nav{display:flex;gap:6px;margin:6px 0 8px;flex-wrap:wrap}
.nav a{padding:5px 12px;border:1px solid var(--line);border-radius:99px;color:var(--ink);text-decoration:none;font-size:.9rem}
.nav a.cur{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.sub2{color:var(--mut);font-size:.85rem;margin:2px 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input,.bar select,.bar button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.bar input{flex:1 1 220px;min-width:160px}
.bar select{flex:1 1 150px;min-width:0;max-width:100%;text-overflow:ellipsis}
.bar .on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
@media (max-width:700px){header{position:static}}
main{max-width:900px;margin:0 auto;padding:14px 16px 60px}
.legendbox{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.9rem}
.legendbox p{margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.chip{padding:3px 10px;border-radius:99px;border:1.5px solid currentColor;font-size:.82rem;font-weight:600;white-space:nowrap}
.chip.k{color:var(--k)}.chip.t{color:var(--t)}.chip.n{color:var(--n);border-style:dashed}.chip.x{color:var(--x);border-color:var(--line)}
.arrow{color:var(--mut)}
.cat{margin:22px 0 8px;font-size:1.05rem;color:var(--brand)}
details.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
details.card>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:flex-start}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸";color:var(--mut)}
details.card[open]>summary::before{content:"▾"}
.tag{flex:none;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor;margin-top:2px}
.tag.ok{color:var(--ok)}.tag.inf{color:var(--inf)}
.in{padding:4px 14px 14px;border-top:1px solid var(--line)}
.meta p{margin:.35em 0}
.meta b{color:var(--brand)}
h4{margin:16px 0 4px;font-size:.95rem;color:var(--brand)}
ol.steps{list-style:none;counter-reset:s;margin:6px 0;padding:0}
ol.steps>li{counter-increment:s;position:relative;padding:8px 0 8px 40px;border-top:1px dashed var(--line)}
ol.steps>li:first-child{border-top:0}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--bg);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.see{margin-top:4px;color:var(--mut);font-size:.92rem;padding-left:10px;border-left:3px solid var(--line)}
figure{margin:8px 0 2px;padding:0}
figure img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
figcaption{font-size:.8rem;color:var(--mut);margin-top:3px}
ul.pl{margin:4px 0;padding-left:20px}
.vd{background:var(--box);border-left:3px solid var(--acc);padding:6px 10px;border-radius:4px;margin:10px 0}
.src{font-size:.84rem;color:var(--mut)}
.src a{color:var(--acc);word-break:break-all}
.hide{display:none}
.empty{color:var(--mut);text-align:center;padding:30px}
@media print{header{position:static}details.card{break-inside:avoid}details.card:not([open])>*:not(summary){display:block}}
</style>
</head>

<script>

  var grpSel=$("grp");

  $("legend").innerHTML=lg;

  function li(arr){return '<ul class="pl">'+arr.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>'}

    h+='<div class="meta"><p><b>Ai làm:</b> '+esc(s.who)+'</p><p><b>Khi nào:</b> '+esc(s.when)+'</p></div>';
    if(s.before && s.before.length) h+='<h4>Trước khi làm</h4>'+li(s.before);
    if(s.flow && s.flow.length){h+='<div class="chips">'+s.flow.map(function(f,i){return (i?'<span class="arrow">→</span>':'')+'<span class="chip '+esc(f[1])+'">'+esc(f[0])+'</span>'}).join("")+'</div>'}
    h+='<h4>Các bước</h4><ol class="steps">';
    s.steps.forEach(function(st){
      h+='<li><div>'+esc(st.t)+'</div>';
      if(st.see) h+='<div class="see">Thấy: '+esc(st.see)+'</div>';
      if(st.img){ h+='<figure><a href="img/'+esc(st.img)+'.png" target="_blank" rel="noopener"><img loading="lazy" src="img/'+esc(st.img)+'.png" alt="'+esc(D.images[st.img]||"")+'"></a><figcaption>'+esc(D.images[st.img]||"")+' — ảnh tài liệu Odoo 19.0 (bấm vào ảnh để xem to)</figcaption></figure>'; }
      h+='</li>';
    });
    h+='</ol>';
    if(s.effect && s.effect.length) h+='<h4>Ảnh hưởng số liệu / bút toán</h4>'+li(s.effect);
    if(s.check && s.check.length) h+='<h4>Cách kiểm sau khi làm</h4>'+li(s.check);
    if(s.errors && s.errors.length) h+='<h4>Lỗi thường gặp và việc cần báo</h4>'+li(s.errors);
    if(s.vd) h+='<div class="vd"><b>Ví dụ công ty A:</b> '+esc(s.vd)+'</div>';
    if(s.src && s.src.length){h+='<p class="src">Nguồn: '+s.src.map(function(u){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace(/^https:\/\/www\.odoo\.com\/documentation\/19\.0\/applications\//,""))+'</a>'}).join(" · ")+'</p>'}
    return h+'</div></details>';
  }
  var html="", last="";
  D.sops.forEach(function(s){
    if(s.group!==last){html+='<h2 class="cat" data-grph="'+esc(s.group)+'">'+esc(D.groups[s.group]||s.group)+'</h2>';last=s.group}

  var heads=[].slice.call(document.querySelectorAll("h2.cat"));
  var text=cards.map(function(el){return el.textContent.toLowerCase()});
  function apply(){
    var q=$("q").value.trim().toLowerCase(), g=grpSel.value, shown=0, per={};

    });
    heads.forEach(function(h){h.classList.toggle("hide",!per[h.dataset.grph])});
    $("none").classList.toggle("hide",shown>0);
    grpSel.classList.toggle("on",g!=="all");
    $("count").textContent=shown+" / "+cards.length+" SOP";
  }
  $("q").addEventListener("input",apply); grpSel.addEventListener("change",apply);
  $("fold").addEventListener("click",function(){cards.forEach(function(el){el.open=false})});
  $("unfold").addEventListener("click",function(){cards.forEach(function(el){if(!el.classList.contains("hide"))el.open=true})});
  apply();
})();
</script>
</body>
</html>
